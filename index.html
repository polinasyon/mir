<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Polinasyon Hava Paneli — Demo</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--muted:#6b7280;--accent:#f59e0b}
    *{box-sizing:border-box}
    body{font-family:Inter, system-ui, Arial;background:var(--bg);color:#111;margin:0;padding:20px}
    .container{max-width:980px;margin:0 auto}
    header{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
    .controls{display:flex;gap:8px}
    .controls input{flex:1;padding:8px;border-radius:8px;border:1px solid #e5e7eb}
    .controls button{padding:8px 12px;border-radius:8px;border:none;background:var(--accent);color:white;cursor:pointer}
    .status{padding:8px;color:var(--muted)}
    .card{background:var(--card);padding:12px;border-radius:10px;box-shadow:0 6px 18px rgba(2,6,23,0.06);margin-bottom:12px}
    .hidden{display:none}
    .current-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .grid{display:flex;gap:8px;flex-wrap:wrap}
    .grid .day{flex:1 1 150px;background:#f3f4f6;padding:8px;border-radius:8px}
    footer{margin-top:8px;color:var(--muted)}
    @media(max-width:600px){.current-grid{grid-template-columns:1fr}}
    canvas{width:100%;height:200px}
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Polinasyon Hava Paneli (Demo)</h1>
      <div class="controls">
        <input id="locInput" placeholder="Şehir veya 'lat,lon' girin (örn: 39.92,32.85)" />
        <button id="btnUseGeo">Konumu Kullan</button>
        <button id="btnFetch">Getir</button>
      </div>
    </header>

    <section id="status" class="status">Hazır</section>

    <section id="current" class="card hidden">
      <h2>Güncel Hava</h2>
      <div class="current-grid">
        <div><strong>Sıcaklık:</strong> <span id="curTemp">—</span> °C</div>
        <div><strong>Rüzgar:</strong> <span id="curWind">—</span> m/s</div>
        <div><strong>Yön:</strong> <span id="curWindDir">—</span></div>
        <div><strong>Zaman:</strong> <span id="curTime">—</span></div>
      </div>
    </section>

    <section id="hourly" class="card hidden">
      <h2>Saatlik Sıcaklık (24h)</h2>
      <canvas id="hourChart"></canvas>
    </section>

    <section id="daily" class="card hidden">
      <h2>Günlük Tahmin</h2>
      <div id="dailyList" class="grid"></div>
    </section>

    <footer>
      <small>Veri kaynağı: Open-Meteo (ücretsiz, anahtarsız)</small>
    </footer>
  </main>

  <script>
    // Kısa ve çalışır weather dashboard JS
    const statusEl = document.getElementById('status');
    const btnFetch = document.getElementById('btnFetch');
    const btnUseGeo = document.getElementById('btnUseGeo');
    const locInput = document.getElementById('locInput');

    const curSection = document.getElementById('current');
    const curTemp = document.getElementById('curTemp');
    const curWind = document.getElementById('curWind');
    const curWindDir = document.getElementById('curWindDir');
    const curTime = document.getElementById('curTime');

    const hourlySection = document.getElementById('hourly');
    const hourCanvas = document.getElementById('hourChart');
    const dailySection = document.getElementById('daily');
    const dailyList = document.getElementById('dailyList');

    const CACHE_KEY = 'polinasyon_weather_cache';
    const CACHE_TTL = 1000 * 60 * 60; // 1 saat

    btnFetch.addEventListener('click', ()=> {
      const val = locInput.value.trim();
      if (!val) return alert('Lütfen şehir veya koordinat girin.');
      fetchForInput(val);
    });
    btnUseGeo.addEventListener('click', ()=> {
      if (!navigator.geolocation) return alert('Geolocation desteklenmiyor.');
      status('Konum alınıyor...');
      navigator.geolocation.getCurrentPosition(pos=>{
        const lat = pos.coords.latitude.toFixed(5), lon = pos.coords.longitude.toFixed(5);
        locInput.value = `${lat},${lon}`;
        fetchForInput(`${lat},${lon}`);
      },err=>{
        status('Konum alınamadı: ' + err.message);
      });
    });

    function status(txt){ statusEl.textContent = txt; }

    function parseInput(input){
      const comma = input.split(',').map(s=>s.trim());
      if (comma.length === 2 && !isNaN(parseFloat(comma[0])) && !isNaN(parseFloat(comma[1]))) {
        return { lat: parseFloat(comma[0]), lon: parseFloat(comma[1]), label: input };
      }
      return null;
    }

    async function fetchForInput(input) {
      status('Hazırlanıyor...');
      const parsed = parseInput(input);
      if (parsed) {
        return fetchWeather(parsed.lat, parsed.lon, parsed.label);
      } else {
        status('Şehir koordinatları alınıyor...');
        try {
          const q = encodeURIComponent(input);
          const geoUrl = `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`;
          const r = await fetch(geoUrl, {headers:{'User-Agent':'polinasyon-weather/1.0 (contact)'}});
          const arr = await r.json();
          if (!arr || !arr[0]) { status('Konum bulunamadı'); return; }
          const lat = parseFloat(arr[0].lat), lon = parseFloat(arr[0].lon);
          fetchWeather(lat, lon, arr[0].display_name);
        } catch(e) {
          status('Geocoding hatası: ' + e.message);
        }
      }
    }

    function cacheGet(key){
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (Date.now() - obj.ts > CACHE_TTL) { localStorage.removeItem(key); return null; }
        return obj.data;
      } catch(e){ return null; }
    }
    function cacheSet(key, data){
      try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch(e){}
    }

    async function fetchWeather(lat, lon, label = '') {
      const cacheKey = `${CACHE_KEY}:${lat.toFixed(3)},${lon.toFixed(3)}`;
      const cached = cacheGet(cacheKey);
      if (cached) {
        status('Önbellekten yükleniyor: ' + label);
        renderWeather(cached, label);
        return;
      }

      status('Veri çekiliyor...');
      try {
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.searchParams.set('latitude', lat);
        url.searchParams.set('longitude', lon);
        url.searchParams.set('current_weather', 'true');
        url.searchParams.set('hourly', 'temperature_2m');
        url.searchParams.set('daily', 'temperature_2m_max,temperature_2m_min,precipitation_sum');
        url.searchParams.set('timezone', 'auto');

        const res = await fetch(url.toString());
        if (!res.ok) throw new Error('API hatası: ' + res.status);
        const data = await res.json();
        cacheSet(cacheKey, data);
        renderWeather(data, label);
        status('Güncellendi: ' + label);
      } catch (e) {
        status('Hata: ' + e.message);
      }
    }

    function renderWeather(data, label){
      if (data.current_weather) {
        curSection.classList.remove('hidden');
        curTemp.textContent = data.current_weather.temperature;
        curWind.textContent = data.current_weather.windspeed;
        curWindDir.textContent = (data.current_weather.winddirection || '—');
        curTime.textContent = data.current_weather.time || '';
      } else {
        curSection.classList.add('hidden');
      }

      if (data.hourly && data.hourly.time && data.hourly.temperature_2m) {
        hourlySection.classList.remove('hidden');
        drawHourlyChart(data.hourly.time.slice(0,24), data.hourly.temperature_2m.slice(0,24));
      } else hourlySection.classList.add('hidden');

      if (data.daily && data.daily.time) {
        dailySection.classList.remove('hidden');
        dailyList.innerHTML = '';
        const times = data.daily.time;
        for (let i=0;i<times.length;i++){
          const el = document.createElement('div');
          el.className = 'day';
          el.innerHTML = `<strong>${times[i]}</strong><div>Max: ${data.daily.temperature_2m_max[i]}°C</div><div>Min: ${data.daily.temperature_2m_min[i]}°C</div><div>Precip: ${data.daily.precipitation_sum ? data.daily.precipitation_sum[i] : 0} mm</div>`;
          dailyList.appendChild(el);
        }
      } else dailySection.classList.add('hidden');
    }

    function drawHourlyChart(times, temps){
      const c = hourCanvas;
      const ctx = c.getContext('2d');
      const w = c.width = c.clientWidth, h = c.height = 200;
      ctx.clearRect(0,0,w,h);
      const max = Math.max(...temps), min = Math.min(...temps);
      const pad = 30;
      ctx.strokeStyle = '#e5e7eb';
      ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.beginPath();
      temps.forEach((t,i)=>{
        const x = pad + (i/(temps.length-1))*(w-2*pad);
        const y = pad + (1 - (t-min)/(max-min || 1))*(h-2*pad);
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
      });
      ctx.stroke();
      ctx.fillStyle = '#374151'; ctx.font = '12px sans-serif';
      ctx.fillText(times[0].slice(11,16), pad, h-6);
      ctx.fillText(times[Math.floor(times.length/2)].slice(11,16), w/2-10, h-6);
      ctx.fillText(times[times.length-1].slice(11,16), w-pad-30, h-6);
    }

    // Örnek başlangıç: Ankara koordinatlarını yerleştir
    locInput.value = '39.92077,32.85411';
  </script>
</body>
</html>
