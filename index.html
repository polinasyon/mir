<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Polinasyon Hava Paneli — Demo</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--muted:#6b7280;--accent:#f59e0b}
    *{box-sizing:border-box}
    body{font-family:Inter, system-ui, Arial;background:var(--bg);color:#111;margin:0;padding:20px}

    /* Sidebar */
    .sidebar{
      position:fixed;
      left:24px;
      top:110px;
      display:flex;
      flex-direction:column;
      gap:12px;
      z-index:1200;
      transition:transform .25s ease,opacity .25s ease;
    }
    .sidebar.collapsed{ transform:translateX(-120%); opacity:0; pointer-events:none }

    .side-btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-width:180px;
      padding:10px 14px;
      background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,250,250,0.98));
      border-radius:12px;
      border:1px solid rgba(2,6,23,0.06);
      box-shadow:0 6px 18px rgba(2,6,23,0.06);
      cursor:pointer;
      color:#0f172a;
      font-weight:600;
      text-decoration:none;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .side-btn:active{ transform:translateY(1px) }
    .side-btn .label{display:flex;align-items:center;gap:10px}
    .side-btn .label .dot{width:10px;height:10px;border-radius:50%;}
    .side-btn svg{width:22px;height:22px;opacity:.95}

    /* small colored left stripes (1-2px) */
    .side-btn[data-color="yellow"]{ border-left:2px solid #f59e0b }
    .side-btn[data-color="green"]{ border-left:2px solid #10b981 }
    .side-btn[data-color="red"]{ border-left:2px solid #ef4444 }
    .side-btn[data-color="purple"]{ border-left:2px solid #7c3aed }

    /* badge */
    .badge{margin-left:8px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
    .badge.green{background:#10b981}
    .badge.yellow{background:#f59e0b}
    .badge.red{background:#ef4444}

    /* subtle hover */
    .side-btn:hover{ box-shadow:0 10px 30px rgba(2,6,23,0.12) }

    /* Main container spacing to avoid overlap */
    .container{max-width:980px;margin:0 auto;padding-left:60px}

    header{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
    .controls{display:flex;gap:8px}
    .controls input{flex:1;padding:8px;border-radius:8px;border:1px solid #e5e7eb}
    .controls button{padding:8px 12px;border-radius:8px;border:none;background:var(--accent);color:white;cursor:pointer}
    .status{padding:8px;color:var(--muted)}
    .card{background:var(--card);padding:12px;border-radius:10px;box-shadow:0 6px 18px rgba(2,6,23,0.06);margin-bottom:12px}
    .hidden{display:none}
    .current-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .grid{display:flex;gap:8px;flex-wrap:wrap}
    .grid .day{flex:1 1 150px;background:#f3f4f6;padding:8px;border-radius:8px}
    footer{margin-top:8px;color:var(--muted)}
    @media(max-width:900px){
      .sidebar{left:12px;top:98px}
      .container{padding-left:20px}
      .side-btn{min-width:140px;padding:8px 10px}
    }
    @media(max-width:520px){
      /* on very small screens collapse sidebar to top-left small stack */
      .sidebar{left:12px;top:84px;gap:8px}
      .container{padding-left:12px}
    }
    canvas{width:100%;height:200px}
  </style>
</head>
<body>
  <!-- Sidebar: visible only on the main page (index.html) -->
  <nav class="sidebar" aria-label="Ana sayfa kısayolları">
    <a class="side-btn" data-color="yellow" href="#top" title="Ana Sayfa">
      <span class="label"><span class="dot" style="background:#f59e0b"></span>Ana Sayfa</span>
      <!-- bee icon -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 3C11 3 9.8 3.7 9 4.7C8.2 5.7 8 6.9 8.2 7.9C7.4 8.4 6.7 9.1 6.2 9.9C5.2 10.7 4.9 11.9 5.4 12.9C5.9 14 6.8 14.7 8 14.9C8.2 15.6 8.7 16.2 9.4 16.5C10.1 16.9 10.9 17 11.6 16.8C12 17.6 12.8 18.2 13.8 18.3C15.1 18.5 16.2 17.9 17 16.9C17.8 15.9 18 14.6 17.6 13.5C18.3 13 18.8 12.2 18.8 11.3C18.8 10 17.9 9 16.7 8.8C16.2 8.1 15.6 7.5 14.8 7.2C14.9 6.6 14.9 5.8 14.6 5.2C14.3 4.5 13.7 4 13 3.7C12.5 3.5 12.2 3 12 3Z" fill="#111" opacity="0.95"/>
      </svg>
    </a>

    <a class="side-btn" data-color="green" href="#current" title="Kovan Sağlığı">
      <span class="label"><span class="dot" style="background:#10b981"></span>Kovan Sağlığı<span class="badge" id="hiveScore">—</span></span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2C9.5 2 7.4 3.5 6.5 6C5.5 8.5 6 11 7.8 12.8C6.9 13.7 6.4 14.9 6.6 16.1C6.9 17.6 8.1 18.7 9.6 19C11 19.3 12.4 19 13.6 18.2C14.8 17.4 15.6 16 15.8 14.4C16.9 13.8 17.6 12.8 17.8 11.7C18.3 9.6 16.9 7.5 14.8 6.9C13.4 6.5 11.7 6 11 4.5C10.6 3.7 11 2 12 2Z" fill="#111"/>
      </svg>
    </a>

    <a class="side-btn" data-color="purple" href="#daily" title="İstatistikler">
      <span class="label"><span class="dot" style="background:#7c3aed"></span>İstatistikler</span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 19H8V10H4V19ZM10 19H14V5H10V19ZM16 19H20V13H16V19Z" fill="#111"/>
      </svg>
    </a>

    <a class="side-btn" data-color="red" href="#footer" title="Ayarlar">
      <span class="label"><span class="dot" style="background:#ef4444"></span>Ayarlar</span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zM19.4 13a7.7 7.7 0 0 0 .1-1 7.7 7.7 0 0 0-.1-1l2.1-1.6a.5.5 0 0 0 .1-.7l-2-3.4a.5.5 0 0 0-.6-.2l-2.5 1a8 8 0 0 0-1.7-1l-.4-2.7A.5.5 0 0 0 12.6 2h-4a.5.5 0 0 0-.5.4L7.6 5.1a8 8 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2L.8 8.8a.5.5 0 0 0 .1.7L3 11a7.7 7.7 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.7l2 3.4c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.7c.1.3.4.4.7.4h4c.3 0 .6-.1.7-.4l.4-2.7c.6-.3 1.2-.7 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.7L19.4 13z" fill="#111"/>
      </svg>
    </a>
  </nav>

  <main class="container" id="top">
    <header>
      <h1>Polinasyon Hava Paneli (Demo)</h1>
      <div class="controls">
        <input id="locInput" placeholder="Şehir veya 'lat,lon' girin (örn: 39.92,32.85)" />
        <button id="btnUseGeo">Konumu Kullan</button>
        <button id="btnFetch">Getir</button>
      </div>
    </header>

    <section id="status" class="status">Hazır</section>

    <section id="current" class="card hidden">
      <h2>Güncel Hava</h2>
      <div class="current-grid">
        <div><strong>Sıcaklık:</strong> <span id="curTemp">—</span> °C</div>
        <div><strong>Rüzgar:</strong> <span id="curWind">—</span> m/s</div>
        <div><strong>Yön:</strong> <span id="curWindDir">—</span></div>
        <div><strong>Zaman:</strong> <span id="curTime">—</span></div>
      </div>
    </section>

    <section id="hourly" class="card hidden">
      <h2>Saatlik Sıcaklık (24h)</h2>
      <canvas id="hourChart"></canvas>
    </section>

    <section id="daily" class="card hidden">
      <h2>Günlük Tahmin</h2>
      <div id="dailyList" class="grid"></div>
    </section>

    <footer id="footer">
      <small>Veri kaynağı: Open-Meteo (ücretsiz, anahtarsız)</small>
    </footer>
  </main>

  <script>
    // Kısa ve çalışır weather dashboard JS (ufak hata toleransı ve daha iyi status mesajları)
    const statusEl = document.getElementById('status');
    const btnFetch = document.getElementById('btnFetch');
    const btnUseGeo = document.getElementById('btnUseGeo');
    const locInput = document.getElementById('locInput');

    const curSection = document.getElementById('current');
    const curTemp = document.getElementById('curTemp');
    const curWind = document.getElementById('curWind');
    const curWindDir = document.getElementById('curWindDir');
    const curTime = document.getElementById('curTime');

    const hourlySection = document.getElementById('hourly');
    const hourCanvas = document.getElementById('hourChart');
    const dailySection = document.getElementById('daily');
    const dailyList = document.getElementById('dailyList');

    const hiveScoreEl = document.getElementById('hiveScore');
    const sidebar = document.querySelector('.sidebar');

    const CACHE_KEY = 'polinasyon_weather_cache';
    const CACHE_TTL = 1000 * 60 * 60; // 1 saat

    btnFetch.addEventListener('click', ()=> {
      const val = locInput.value.trim();
      if (!val) return alert('Lütfen şehir veya koordinat girin.');
      fetchForInput(val);
      collapseSidebar(true); // hide when menu used
    });
    btnUseGeo.addEventListener('click', ()=> {
      if (!navigator.geolocation) return alert('Geolocation desteklenmiyor.');
      status('Konum alınıyor...');
      navigator.geolocation.getCurrentPosition(pos=>{
        const lat = pos.coords.latitude.toFixed(5), lon = pos.coords.longitude.toFixed(5);
        locInput.value = `${lat},${lon}`;
        fetchForInput(`${lat},${lon}`);
      },err=>{
        status('Konum alınamadı: ' + err.message);
      });
      collapseSidebar(true);
    });

    function status(txt){ statusEl.textContent = txt; }

    function collapseSidebar(v){
      if(!sidebar) return;
      sidebar.classList.toggle('collapsed', !!v);
    }

    // hide sidebar when input focused (simulates "menu açılınca")
    locInput.addEventListener('focus', ()=> collapseSidebar(true));
    locInput.addEventListener('blur', ()=> setTimeout(()=> collapseSidebar(false), 200));

    // click outside controls will reopen sidebar
    document.addEventListener('click', (e)=>{
      const inControls = e.target.closest('.controls');
      const inSidebar = e.target.closest('.sidebar');
      if (inControls) collapseSidebar(true);
      else if (!inSidebar) collapseSidebar(false);
    }, {capture:true});

    function parseInput(input){
      const comma = input.split(',').map(s=>s.trim());
      if (comma.length === 2 && !isNaN(parseFloat(comma[0])) && !isNaN(parseFloat(comma[1]))) {
        return { lat: parseFloat(comma[0]), lon: parseFloat(comma[1]), label: input };
      }
      return null;
    }

    function cacheGet(key){
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (Date.now() - obj.ts > CACHE_TTL) { localStorage.removeItem(key); return null; }
        return obj.data;
      } catch(e){ return null; }
    }
    function cacheSet(key, data){
      try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch(e){}
    }

    async function fetchForInput(input) {
      status('Hazırlanıyor...');
      const parsed = parseInput(input);
      if (parsed) {
        return fetchWeather(parsed.lat, parsed.lon, parsed.label);
      } else {
        status('Şehir koordinatları alınıyor...');
        try {
          const q = encodeURIComponent(input);
          const geoUrl = `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`;
          const r = await fetch(geoUrl); // remove custom User-Agent — browsers block setting it
          const arr = await r.json();
          if (!arr || !arr[0]) { status('Konum bulunamadı'); return; }
          const lat = parseFloat(arr[0].lat), lon = parseFloat(arr[0].lon);
          fetchWeather(lat, lon, arr[0].display_name);
        } catch(e) {
          status('Geocoding hatası: ' + e.message);
        }
      }
    }

    async function fetchWeather(lat, lon, label = '') {
      const cacheKey = `${CACHE_KEY}:${lat.toFixed(3)},${lon.toFixed(3)}`;
      const cached = cacheGet(cacheKey);
      if (cached) {
        status('Önbellekten yükleniyor: ' + label);
        renderWeather(cached, label);
        return;
      }

      status('Veri çekiliyor...');
      try {
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.searchParams.set('latitude', lat);
        url.searchParams.set('longitude', lon);
        url.searchParams.set('current_weather', 'true');
        url.searchParams.set('hourly', 'temperature_2m');
        url.searchParams.set('daily', 'temperature_2m_max,temperature_2m_min,precipitation_sum');
        url.searchParams.set('timezone', 'auto');

        const res = await fetch(url.toString());
        if (!res.ok) throw new Error('API hatası: ' + res.status);
        const data = await res.json();
        cacheSet(cacheKey, data);
        renderWeather(data, label);
        status('Güncellendi: ' + label);
      } catch (e) {
        status('Hata: ' + e.message);
      }
    }

    function computeHiveScore(data){
      // Simple heuristic: ideal temp ~20°C, low wind, low precip => high score
      if (!data || !data.current_weather) return null;
      const temp = data.current_weather.temperature;
      const wind = data.current_weather.windspeed || 0;
      // precipitation approx from daily sum of first day if available
      const precip = (data.daily && data.daily.precipitation_sum && data.daily.precipitation_sum[0]) ? data.daily.precipitation_sum[0] : 0;
      let score = 100;
      score -= Math.abs(temp - 20) * 2; // penalty per degree
      if (wind > 8) score -= 20; else if (wind > 5) score -= 8;
      score -= Math.min(precip * 2, 30);
      score = Math.round(Math.max(0, Math.min(100, score)));
      return score;
    }
    function updateHiveScoreFromData(data){
      const score = computeHiveScore(data);
      if (score === null){ hiveScoreEl.textContent = '—'; hiveScoreEl.className='badge'; return; }
      hiveScoreEl.textContent = score + '%';
      hiveScoreEl.className = 'badge ' + (score >= 75 ? 'green' : (score >= 50 ? 'yellow' : 'red'));
    }

    function renderWeather(data, label){
      updateHiveScoreFromData(data);

      if (data.current_weather) {
        curSection.classList.remove('hidden');
        curTemp.textContent = data.current_weather.temperature;
        curWind.textContent = data.current_weather.windspeed;
        curWindDir.textContent = (data.current_weather.winddirection || '—');
        curTime.textContent = data.current_weather.time || '';
      } else {
        curSection.classList.add('hidden');
      }

      if (data.hourly && data.hourly.time && data.hourly.temperature_2m) {
        hourlySection.classList.remove('hidden');
        drawHourlyChart(data.hourly.time.slice(0,24), data.hourly.temperature_2m.slice(0,24));
      } else hourlySection.classList.add('hidden');

      if (data.daily && data.daily.time) {
        dailySection.classList.remove('hidden');
        dailyList.innerHTML = '';
        const times = data.daily.time;
        for (let i=0;i<times.length;i++){
          const el = document.createElement('div');
          el.className = 'day';
          el.innerHTML = `<strong>${times[i]}</strong><div>Max: ${data.daily.temperature_2m_max[i]}°C</div><div>Min: ${data.daily.temperature_2m_min[i]}°C</div><div>Precip: ${data.daily.precipitation_sum ? data.daily.precipitation_sum[i] : 0} mm</div>`;
          dailyList.appendChild(el);
        }
      } else dailySection.classList.add('hidden');
    }

    function drawHourlyChart(times, temps){
      const c = hourCanvas;
      const ctx = c.getContext('2d');
      const w = c.width = c.clientWidth, h = c.height = 200;
      ctx.clearRect(0,0,w,h);
      const max = Math.max(...temps), min = Math.min(...temps);
      const pad = 30;
      ctx.strokeStyle = '#e5e7eb';
      ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.beginPath();
      temps.forEach((t,i)=>{
        const x = pad + (i/(temps.length-1))*(w-2*pad);
        const y = pad + (1 - (t-min)/(max-min || 1))*(h-2*pad);
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
      });
      ctx.stroke();
      ctx.fillStyle = '#374151'; ctx.font = '12px sans-serif';
      ctx.fillText(times[0].slice(11,16), pad, h-6);
      ctx.fillText(times[Math.floor(times.length/2)].slice(11,16), w/2-10, h-6);
      ctx.fillText(times[times.length-1].slice(11,16), w-pad-30, h-6);
    }

    // Örnek başlangıç: Ankara koordinatlarını yerleştir ve otomatik fetch et
    locInput.value = '39.92077,32.85411';
    // otomatik yükle bir saniye sonra (sayfa açıldığında birden fazla istek engellenmesi için küçük gecikme)
    setTimeout(()=>{ try{ btnFetch.click(); }catch(e){} }, 800);
  </script>
</body>
</html>
