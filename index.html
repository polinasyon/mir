<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Polinasyon Hava Paneli — Demo</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--muted:#6b7280;--accent:#f59e0b;--dark:#0b1220}
    *{box-sizing:border-box}
    body{font-family:Inter, system-ui, Arial;background:var(--bg);color:#111;margin:0;padding:20px}

    /* Fullscreen Sidebar / Menu overlay */
    .menu-overlay{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1400;
      background:linear-gradient(180deg, rgba(8,10,13,0.94), rgba(6,8,10,0.96));
      transition:opacity .28s ease,visibility .28s ease;opacity:1;visibility:visible;
    }
    .menu-overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none }

    .menu-list{display:flex;flex-direction:column;gap:18px;align-items:center;width:100%;max-width:420px;padding:24px}

    .menu-btn{
      width:100%;padding:18px 20px;border-radius:14px;background:var(--dark);color:var(--accent);font-weight:800;letter-spacing:.6px;border:1px solid rgba(255,255,255,0.04);
      display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;box-shadow:0 8px 30px rgba(2,6,23,0.6);transform:translateY(0);
      transition:transform .4s cubic-bezier(.2,.9,.3,1),opacity .28s ease,box-shadow .2s ease;
    }
    .menu-btn.small{padding:12px 16px;border-radius:10px}
    .menu-btn .label{display:flex;align-items:center;gap:12px;font-size:16px}
    .menu-btn .label .bee{width:28px;height:28px;display:inline-block}
    .menu-btn span.count{background:rgba(255,255,255,0.04);padding:6px 10px;border-radius:999px;color:#fff;font-weight:700}

    /* pressed animation helpers */
    .menu-btn.pressed{transform:translateY(30px);opacity:0}

    /* Main container shift to accommodate hidden overlay later */
    .container{max-width:980px;margin:0 auto}

    header{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
    .controls{display:flex;gap:8px}
    .controls input{flex:1;padding:8px;border-radius:8px;border:1px solid #e5e7eb}
    .controls button{padding:8px 12px;border-radius:8px;border:none;background:var(--accent);color:white;cursor:pointer}
    .status{padding:8px;color:var(--muted)}
    .card{background:var(--card);padding:12px;border-radius:10px;box-shadow:0 6px 18px rgba(2,6,23,0.06);margin-bottom:12px}
    .hidden{display:none}
    .current-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .grid{display:flex;gap:8px;flex-wrap:wrap}
    .grid .day{flex:1 1 150px;background:#f3f4f6;padding:8px;border-radius:8px}
    footer{margin-top:8px;color:var(--muted)}

    @media(max-width:520px){
      .menu-list{max-width:320px;padding:18px}
      .menu-btn{padding:14px 16px}
    }

    canvas{width:100%;height:200px}
  </style>
</head>
<body>
  <!-- Full screen menu overlay (buttons cover screen) -->
  <div class="menu-overlay" id="menuOverlay" role="dialog" aria-label="Ana Menü">
    <div class="menu-list" id="menuList">
      <button class="menu-btn" data-target="top" id="btnHome">
        <span class="label"><svg class="bee" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3C11 3 9.8 3.7 9 4.7C8.2 5.7 8 6.9 8.2 7.9C7.4 8.4 6.7 9.1 6.2 9.9C5.2 10.7 4.9 11.9 5.4 12.9C5.9 14 6.8 14.7 8 14.9C8.2 15.6 8.7 16.2 9.4 16.5C10.1 16.9 10.9 17 11.6 16.8C12 17.6 12.8 18.2 13.8 18.3C15.1 18.5 16.2 17.9 17 16.9C17.8 15.9 18 14.6 17.6 13.5C18.3 13 18.8 12.2 18.8 11.3C18.8 10 17.9 9 16.7 8.8C16.2 8.1 15.6 7.5 14.8 7.2C14.9 6.6 14.9 5.8 14.6 5.2C14.3 4.5 13.7 4 13 3.7C12.5 3.5 12.2 3 12 3Z" fill="#f59e0b"/></svg>Ana Sayfa</span>
        <span class="count">Home</span>
      </button>

      <button class="menu-btn" data-target="hive" id="btnHive">
        <span class="label"><svg class="bee" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C9.5 2 7.4 3.5 6.5 6C5.5 8.5 6 11 7.8 12.8C6.9 13.7 6.4 14.9 6.6 16.1C6.9 17.6 8.1 18.7 9.6 19C11 19.3 12.4 19 13.6 18.2C14.8 17.4 15.6 16 15.8 14.4C16.9 13.8 17.6 12.8 17.8 11.7C18.3 9.6 16.9 7.5 14.8 6.9C13.4 6.5 11.7 6 11 4.5C10.6 3.7 11 2 12 2Z" fill="#f59e0b"/></svg>Kovan Sağlığı</span>
        <span class="count" id="hiveBadge">—</span>
      </button>

      <button class="menu-btn" data-target="daily" id="btnStats">
        <span class="label"><svg class="bee" viewBox="0 0 24 24" fill="#f59e0b" xmlns="http://www.w3.org/2000/svg"><path d="M4 19H8V10H4V19ZM10 19H14V5H10V19ZM16 19H20V13H16V19Z"/></svg>İstatistikler</span>
        <span class="count">7g</span>
      </button>

      <button class="menu-btn" data-target="footer" id="btnSettings">
        <span class="label"><svg class="bee" viewBox="0 0 24 24" fill="#f59e0b" xmlns="http://www.w3.org/2000/svg"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zM19.4 13a7.7 7.7 0 0 0 .1-1 7.7 7.7 0 0 0-.1-1l2.1-1.6a.5.5 0 0 0 .1-.7l-2-3.4a.5.5 0 0 0-.6-.2l-2.5 1a8 8 0 0 0-1.7-1l-.4-2.7A.5.5 0 0 0 12.6 2h-4a.5.5 0 0 0-.5.4L7.6 5.1a8 8 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2L.8 8.8a.5.5 0 0 0 .1.7L3 11a7.7 7.7 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.7l2 3.4c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.7c.1.3.4.4.7.4h4c.3 0 .6-.1.7-.4l.4-2.7c.6-.3 1.2-.7 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.7L19.4 13z"/></svg>Ayarlar</span>
        <span class="count">⚙</span>
      </button>
    </div>
  </div>

  <main class="container" id="top">
    <header>
      <h1>Polinasyon Hava Paneli (Demo)</h1>
      <div class="controls">
        <input id="locInput" placeholder="Şehir veya 'lat,lon' girin (örn: 39.92,32.85)" />
        <button id="btnUseGeo">Konumu Kullan</button>
        <button id="btnFetch">Getir</button>
      </div>
    </header>

    <section id="status" class="status">Hazır</section>

    <!-- Güncel Hava (removed as requested) -->

    <section id="hourly" class="card hidden">
      <h2>Saatlik Sıcaklık (24h)</h2>
      <canvas id="hourChart"></canvas>
    </section>

    <section id="daily" class="card hidden">
      <h2>Günlük Tahmin</h2>
      <div id="dailyList" class="grid"></div>
    </section>

    <footer id="footer">
      <small>Veri kaynağı: Open-Meteo (ücretsiz, anahtarsız)</small>
    </footer>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const btnFetch = document.getElementById('btnFetch');
    const btnUseGeo = document.getElementById('btnUseGeo');
    const locInput = document.getElementById('locInput');

    const hourlySection = document.getElementById('hourly');
    const hourCanvas = document.getElementById('hourChart');
    const dailySection = document.getElementById('daily');
    const dailyList = document.getElementById('dailyList');

    const menuOverlay = document.getElementById('menuOverlay');
    const menuBtns = Array.from(document.querySelectorAll('.menu-btn'));
    const hiveBadge = document.getElementById('hiveBadge');

    const CACHE_KEY = 'polinasyon_weather_cache';
    const CACHE_TTL = 1000 * 60 * 60; // 1 saat

    function status(txt){ statusEl.textContent = txt; }

    btnFetch.addEventListener('click', ()=> {
      const val = locInput.value.trim();
      if (!val) return alert('Lütfen şehir veya koordinat girin.');
      fetchForInput(val);
      hideMenuWithAnimation();
    });
    btnUseGeo.addEventListener('click', ()=> {
      if (!navigator.geolocation) return alert('Geolocation desteklenmiyor.');
      status('Konum alınıyor...');
      navigator.geolocation.getCurrentPosition(pos=>{
        const lat = pos.coords.latitude.toFixed(5), lon = pos.coords.longitude.toFixed(5);
        locInput.value = `${lat},${lon}`;
        fetchForInput(`${lat},${lon}`);
      },err=>{
        status('Konum alınamadı: ' + err.message);
      });
      hideMenuWithAnimation();
    });

    // menu button behaviour: when pressed they slide down/up and menu hides, then target section opens
    menuBtns.forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const target = btn.dataset.target;
        // add pressed animation to all buttons
        menuBtns.forEach((b, i) => {
          setTimeout(()=> b.classList.add('pressed'), i*40);
        });
        // wait for animation
        await new Promise(r => setTimeout(r, 400));
        // hide overlay and reset pressed state after hidden
        menuOverlay.classList.add('hidden');
        // ensure pressed classes are removed so buttons don't keep animating next time
        setTimeout(()=> menuBtns.forEach(b => b.classList.remove('pressed')), 60);
        // open target
        openTarget(target);
      });
    });

    function hideMenuWithAnimation(){
      menuBtns.forEach((b,i)=> setTimeout(()=> b.classList.add('pressed'), i*30));
      // hide overlay after animation and clear pressed class
      setTimeout(()=>{
        menuOverlay.classList.add('hidden');
        menuBtns.forEach(b => b.classList.remove('pressed'));
      }, 380);
    }
    function showMenu(){
      // remove pressed class and force reflow so animations start from neutral state
      menuBtns.forEach(b => b.classList.remove('pressed'));
      // force a reflow
      void menuOverlay.offsetWidth;
      menuOverlay.classList.remove('hidden');
    }

    function openTarget(target){
      // simple: scroll to section and reveal it
      if (target === 'daily'){
        dailySection.classList.remove('hidden');
        dailySection.scrollIntoView({behavior:'smooth'});
      } else if (target === 'hive'){
        // show daily and hourly as hive overview
        hourlySection.classList.remove('hidden');
        dailySection.classList.remove('hidden');
        hourlySection.scrollIntoView({behavior:'smooth'});
      } else if (target === 'footer'){
        document.getElementById('footer').scrollIntoView({behavior:'smooth'});
      } else {
        window.scrollTo({top:0,behavior:'smooth'});
      }
    }

    function cacheGet(key){
      try { const raw = localStorage.getItem(key); if (!raw) return null; const obj = JSON.parse(raw); if (Date.now() - obj.ts > CACHE_TTL) { localStorage.removeItem(key); return null; } return obj.data; } catch(e){ return null; }
    }
    function cacheSet(key,data){ try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch(e){}
    }

    function parseInput(input){
      const comma = input.split(',').map(s=>s.trim());
      if (comma.length === 2 && !isNaN(parseFloat(comma[0])) && !isNaN(parseFloat(comma[1]))) {
        return { lat: parseFloat(comma[0]), lon: parseFloat(comma[1]), label: input };
      }
      return null;
    }

    async function fetchForInput(input) {
      status('Hazırlanıyor...');
      const parsed = parseInput(input);
      if (parsed) {
        return fetchWeather(parsed.lat, parsed.lon, parsed.label);
      } else {
        status('Şehir koordinatları alınıyor...');
        try {
          const q = encodeURIComponent(input);
          const geoUrl = `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`;
          const r = await fetch(geoUrl);
          const arr = await r.json();
          if (!arr || !arr[0]) { status('Konum bulunamadı'); return; }
          const lat = parseFloat(arr[0].lat), lon = parseFloat(arr[0].lon);
          fetchWeather(lat, lon, arr[0].display_name);
        } catch(e) {
          status('Geocoding hatası: ' + e.message);
        }
      }
    }

    async function fetchWeather(lat, lon, label = '') {
      const cacheKey = `${CACHE_KEY}:${lat.toFixed(3)},${lon.toFixed(3)}`;
      const cached = cacheGet(cacheKey);
      if (cached) { status('Önbellekten yükleniyor: ' + label); renderWeather(cached); return; }
      status('Veri çekiliyor...');
      try {
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.searchParams.set('latitude', lat);
        url.searchParams.set('longitude', lon);
        url.searchParams.set('current_weather', 'true');
        url.searchParams.set('hourly', 'temperature_2m');
        url.searchParams.set('daily', 'temperature_2m_max,temperature_2m_min,precipitation_sum');
        url.searchParams.set('timezone', 'auto');
        const res = await fetch(url.toString());
        if (!res.ok) throw new Error('API hatası: ' + res.status);
        const data = await res.json(); cacheSet(cacheKey, data); renderWeather(data); status('Güncellendi: ' + label);
      } catch (e) { status('Hata: ' + e.message); }
    }

    function renderWeather(data){
      // compute a simple hive badge based on daily precip and hourly temps if present
      let score = 80;
      if (data.daily && data.daily.precipitation_sum) score -= Math.min(30, data.daily.precipitation_sum[0]*2);
      if (data.current_weather && data.current_weather.windspeed) score -= data.current_weather.windspeed > 8 ? 15 : 0;
      score = Math.max(10, Math.round(score));
      hiveBadge.textContent = score + '%';

      if (data.hourly && data.hourly.time && data.hourly.temperature_2m){ hourlySection.classList.remove('hidden'); drawHourlyChart(data.hourly.time.slice(0,24), data.hourly.temperature_2m.slice(0,24)); }
      if (data.daily && data.daily.time){ dailySection.classList.remove('hidden'); dailyList.innerHTML=''; const times = data.daily.time; for(let i=0;i<times.length;i++){ const el=document.createElement('div'); el.className='day'; el.innerHTML=`<strong>${times[i]}</strong><div>Max: ${data.daily.temperature_2m_max[i]}°C</div><div>Min: ${data.daily.temperature_2m_min[i]}°C</div><div>Precip: ${data.daily.precipitation_sum ? data.daily.precipitation_sum[i] : 0} mm</div>`; dailyList.appendChild(el); } }
    }

    function drawHourlyChart(times, temps){ const c = hourCanvas; const ctx = c.getContext('2d'); const w = c.width = c.clientWidth, h = c.height = 200; ctx.clearRect(0,0,w,h); const max = Math.max(...temps), min = Math.min(...temps); const pad = 30; ctx.strokeStyle = '#e5e7eb'; ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke(); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.beginPath(); temps.forEach((t,i)=>{ const x = pad + (i/(temps.length-1))*(w-2*pad); const y = pad + (1 - (t-min)/(max-min || 1))*(h-2*pad); if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill(); }); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.fillText(times[0].slice(11,16), pad, h-6); ctx.fillText(times[Math.floor(times.length/2)].slice(11,16), w/2-10, h-6); ctx.fillText(times[times.length-1].slice(11,16), w-pad-30, h-6); }

    // initial demo load
    locInput.value = '39.92077,32.85411';
    setTimeout(()=>{ try{ btnFetch.click(); }catch(e){} }, 700);

    // keep existing top-left reopen behaviour (if user taps top-left area) — fixed showMenu to reset pressed states
    document.addEventListener('click', (e)=>{
      const atTopLeft = e.clientX < 80 && e.clientY < 80;
      if (atTopLeft) showMenu();
    });
  </script>
</body>
</html>
